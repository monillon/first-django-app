name: Init SQL

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Docker compose install
      uses: hoverkraft-tech/compose-action@v2.2.0
      with: 
        compose-file: "./docker-compose.yaml"

    - name: bla bla
      run: echo "le docker compose est passé"

    - name: test ls compose
      run: docker compose ls

    - name: init database
      run: |
        psql --version
        psql postgresql://postgres:changeme@localhost:5432 -a -f init.sql








